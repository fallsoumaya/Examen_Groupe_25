<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Téranga - Créer un compte</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="carte">
    <header class="entete">
      <p class="logo">Téranga</p>
      <h1>Créer un compte</h1>
      <p class="sous-titre">C'est simple et gratuit</p>
    </header>

    <form action="#" method="post">

      <div class="ligne">
        <input type="text" name="prenom" placeholder="Prénom" aria-label="Prénom" required>
        <input type="text" name="nom" placeholder="Nom de famille" aria-label="Nom de famille" required>
      </div>

      <fieldset>
        <legend>Date de naissance</legend>
        <div class="ligne ligne-3">
          <input type="number" name="jour" placeholder="Jour" min="1" max="31" aria-label="Jour de naissance" required>
          <select name="mois" aria-label="Mois">
          <option value="1">Jan</option>
          <option value="2">Fév</option>
          <option value="3">Mar</option>
          <option value="4">Avr</option>
          <option value="5">Mai</option>
          <option value="6">Juin</option>
          <option value="7">Juil</option>
          <option value="8">Août</option>
          <option value="9">Sep</option>
          <option value="10">Oct</option>
          <option value="11">Nov</option>
          <option value="12">Déc</option>
          </select>
          <input type="number" name="annee" placeholder="Année" min="1920" max="2012" aria-label="Année de naissance" required>
        </div>
      </fieldset>

      <fieldset>
        <legend>Genre</legend>
        <div class="ligne ligne-3">
          <label class="choix"><span>Femme</span><input type="radio" name="genre" value="femme"></label>
          <label class="choix"><span>Homme</span><input type="radio" name="genre" value="homme"></label>
          <label class="choix"><span>Je préfére ne pas dire</span><input type="radio" name="genre" value="perso"></label>
        </div>
      </fieldset>

      <input type="text" name="contact" placeholder="Numéro mobile ou e-mail" aria-label="Numéro mobile ou e-mail" required>
      <input type="password" name="mdp" placeholder="Nouveau mot de passe" aria-label="Nouveau mot de passe" required>

      <button type="submit">S'inscrire</button>
    </form>
  </main>
</body>
</html>
